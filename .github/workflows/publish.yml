name: Publish Package to npm

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Check if version changed
        id: version-check
        run: |
          PACKAGE_VERSION=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('./package.json','utf8')).version)")
          PUBLISHED_VERSION=$(npm view @asafarim/envage version 2>/dev/null || echo "none")
          
          echo "Package version: $PACKAGE_VERSION"
          echo "Published version: $PUBLISHED_VERSION"
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          
          if [ "$PACKAGE_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version unchanged, skipping publish"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version changed, will publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure npm auth
        if: steps.version-check.outputs.should_publish == 'true'
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        id: publish
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify Discord (published)
        if: steps.publish.outcome == 'success'
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"✅ Published @asafarim/envage@${{ steps.version-check.outputs.package_version }}\",\"description\":\"Successfully published to npm.\",\"color\":3066993,\"fields\":[{\"name\":\"Commit\",\"value\":\"[${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\",\"inline\":true},{\"name\":\"Actor\",\"value\":\"${{ github.actor }}\",\"inline\":true}]}]}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Discord (skipped)
        if: steps.version-check.outputs.should_publish == 'false'
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"⏭️ Publish skipped — @asafarim/envage\",\"description\":\"Version unchanged, nothing published.\",\"color\":10181046,\"fields\":[{\"name\":\"Actor\",\"value\":\"${{ github.actor }}\",\"inline\":true}]}]}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Discord (failed)
        if: failure()
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Publish failed — @asafarim/envage\",\"description\":\"Workflow failed. Check the logs for details.\",\"color\":15158332,\"fields\":[{\"name\":\"Commit\",\"value\":\"[${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\",\"inline\":true},{\"name\":\"Actor\",\"value\":\"${{ github.actor }}\",\"inline\":true}]}]}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
