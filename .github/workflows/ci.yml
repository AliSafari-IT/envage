name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test --runInBand
      - run: pnpm --dir demo install --frozen-lockfile
      - run: pnpm --dir demo build
  react19:
    name: Demo (React 19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm --dir demo install --frozen-lockfile
      - run: pnpm --dir demo add react@^19 react-dom@^19
      - run: pnpm --dir demo add -D @types/react@^19 @types/react-dom@^19
      - run: pnpm --dir demo build
